services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wallet
      MYSQL_USER: wallet
      MYSQL_PASSWORD: wallet
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uwallet", "-pwallet"]
      interval: 5s
      timeout: 3s
      retries: 20
